services:
  app:
    build:
      context: .
      target: dev
    env_file: .env.app
    environment:
      PORT: "8080"
      K_SERVICE: dev
      K_REVISION: dev-00001
      K_CONFIGURATION: dev
      DB_HOST: db
      WP_REDIS_HOST: redis
      PROXY_URL: localhost:8080
    ports:
      - 3000:3000
      - 3001:3001
      - 8080:8080
    privileged: true
    init: true
    volumes:
      - .:/app
      - config:/root/.config
    depends_on:
      - db
      - redis

  db:
    image: mysql:8
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: true
    volumes:
      - var-lib-mysql:/var/lib/mysql

  redis:
    image: redis:7

volumes:
  var-lib-mysql:
  config: